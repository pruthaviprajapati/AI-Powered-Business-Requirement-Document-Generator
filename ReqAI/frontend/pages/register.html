<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register • ReqAI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon"><i class="fas fa-robot"></i></div>
        <h4>Create Account</h4>
        <p>Join ReqAI – automate your requirement documents</p>
      </div>

      <form id="register-form">
        <div class="mb-3">
          <label class="form-label-custom">Full Name</label>
          <input type="text" class="form-control-custom" id="full_name" required>
        </div>
        <div class="mb-3">
          <label class="form-label-custom">Email</label>
          <input type="email" class="form-control-custom" id="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label-custom">Username</label>
          <input type="text" class="form-control-custom" id="username" required>
          <small class="text-muted" style="font-size:.75rem;">3–50 characters, letters/numbers/underscore only</small>
        </div>
        <div class="mb-3">
          <label class="form-label-custom">Password</label>
          <input type="password" class="form-control-custom" id="password" required>
          <small class="text-muted" style="font-size:.75rem;">At least 8 characters</small>
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-3">Create Account</button>
      </form>

      <div class="text-center">
        <small class="text-muted">Already have an account? <a href="login.html" class="text-primary">Login</a></small>
      </div>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script>
    redirectIfAuthenticated();

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const full_name = document.getElementById('full_name').value.trim();
      const email = document.getElementById('email').value.trim();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      showLoading();
      try {
        await registerAPI(full_name, email, username, password);
        showToast('Account created! Redirecting to login...', 'success');
        setTimeout(() => window.location.href = 'login.html', 1500);
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        hideLoading();
      }
    });
  </script>
</body>
</html>
