<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meetings • ReqAI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
</head>
<body>

  <div class="main-content">
    <div class="content-area">

      <!-- Header -->
      <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
          <h5 class="mb-0 fw-bold">Meetings</h5>
          <small class="text-muted">Track your requirement-gathering sessions</small>
        </div>
        <button class="btn-primary-custom" onclick="openCreateModal()">
          <i class="fas fa-plus"></i> New Meeting
        </button>
      </div>

      <!-- Meetings Table Card -->
      <div class="req-card">
        <div class="card-body p-0">
          <div id="meetings-table-wrapper"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Create / Edit Modal -->
  <div class="modal fade" id="meetingModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content" style="border-radius:var(--border-radius);">
        <div class="modal-header">
          <h5 class="modal-title fw-semibold" id="meetingModalLabel">New Meeting</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="meeting-id">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label-custom">Meeting Title *</label>
              <input type="text" class="form-control-custom" id="meeting-title" required>
            </div>
            <div class="col-12">
              <label class="form-label-custom">Project *</label>
              <select class="form-control-custom" id="meeting-project"></select>
            </div>
            <div class="col-md-6">
              <label class="form-label-custom">Meeting Date</label>
              <input type="date" class="form-control-custom" id="meeting-date">
            </div>
            <div class="col-md-6">
              <label class="form-label-custom">Duration (minutes)</label>
              <input type="number" class="form-control-custom" id="meeting-duration" min="1">
            </div>
            <div class="col-12">
              <label class="form-label-custom">Participants</label>
              <input type="text" class="form-control-custom" id="meeting-participants"
                     placeholder="e.g. John Smith, Jane Doe">
            </div>
            <div class="col-12">
              <label class="form-label-custom">Description</label>
              <textarea class="form-control-custom" id="meeting-desc" rows="3"
                        placeholder="What was discussed in this meeting?"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn-primary-custom" onclick="saveMeeting()">
            <i class="fas fa-save"></i> Save Meeting
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/sidebar.js"></script>
  <script>
    requireAuth();
    renderLayout('Meetings', 'meetings');

    let modalInstance = null;
    let allProjects = [];

    let allMeetings = [];

    async function loadAll() {
      showLoading();
      try {
        const [pData, mData] = await Promise.all([getProjectsAPI(), getMeetingsAPI()]);
        allProjects = pData.projects || [];
        allMeetings = mData.meetings || [];
        renderMeetingsTable(allMeetings);
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        hideLoading();
      }
    }

    function renderMeetingsTable(meetings) {
      const wrapper = document.getElementById('meetings-table-wrapper');
      if (meetings.length === 0) {
        wrapper.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-calendar-check"></i>
            <h5>No Meetings Yet</h5>
            <p>Create your first meeting to start capturing requirements.</p>
          </div>`;
        return;
      }

      const projectMap = {};
      allProjects.forEach(p => { projectMap[p.id] = p.name; });

      wrapper.innerHTML = `
        <div class="table-responsive">
          <table class="req-table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Project</th>
                <th>Date</th>
                <th>Duration</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${meetings.map(m => `
                <tr>
                  <td><strong>${m.title}</strong></td>
                  <td>${projectMap[m.project_id] || '—'}</td>
                  <td>${m.meeting_date ? formatDate(m.meeting_date) : '—'}</td>
                  <td>${m.duration_minutes ? m.duration_minutes + ' min' : '—'}</td>
                  <td>${getStatusBadge(m.processing_status)}</td>
                  <td>
                    <a href="meeting_detail.html?id=${m.id}" class="btn btn-sm btn-outline-success me-1" title="View Details">
                      <i class="fas fa-eye"></i>
                    </a>
                    <button class="btn btn-sm btn-outline-primary me-1"
                      data-meeting-id="${m.id}" onclick="openEditById(this.dataset.meetingId)">
                      <i class="fas fa-pen"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger"
                      onclick="deleteMeeting(${m.id})">
                      <i class="fas fa-trash"></i>
                    </button>
                  </td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
    }

    function populateProjectDropdown(selectedId = null) {
      const select = document.getElementById('meeting-project');
      select.innerHTML = '<option value="">-- Select Project --</option>' +
        allProjects.map(p =>
          `<option value="${p.id}" ${String(p.id) === String(selectedId) ? 'selected' : ''}>${p.name}</option>`
        ).join('');
      // Auto-select first project if only one exists
      if (allProjects.length === 1 && !selectedId) {
        select.value = allProjects[0].id;
      }
    }

    async function openCreateModal() {
      // Load projects on-demand if not yet loaded (handles fast clicks before loadAll completes)
      if (allProjects.length === 0) {
        try {
          const pData = await getProjectsAPI();
          allProjects = pData.projects || [];
        } catch (err) {
          showToast('Could not load projects: ' + err.message, 'error');
          return;
        }
      }

      if (allProjects.length === 0) {
        showToast('Please create a Project first before adding a Meeting.', 'warning');
        setTimeout(() => { window.location.href = 'projects.html'; }, 1800);
        return;
      }

      document.getElementById('meetingModalLabel').textContent = 'New Meeting';
      document.getElementById('meeting-id').value = '';
      document.getElementById('meeting-title').value = '';
      document.getElementById('meeting-date').value = '';
      document.getElementById('meeting-duration').value = '';
      document.getElementById('meeting-participants').value = '';
      document.getElementById('meeting-desc').value = '';
      populateProjectDropdown();

      const modalEl = document.getElementById('meetingModal');
      if (!modalEl) {
        showToast('Modal element not found. Please refresh the page.', 'error');
        return;
      }

      if (typeof bootstrap === 'undefined') {
        showToast('Bootstrap not loaded. Please check internet connection.', 'error');
        return;
      }

      modalInstance = new bootstrap.Modal(modalEl);
      modalInstance.show();
    }

    function openEditById(id) {
      const meeting = allMeetings.find(m => m.id === parseInt(id));
      if (!meeting) { showToast('Meeting not found.', 'error'); return; }
      openEditModal(meeting);
    }

    function openEditModal(meeting) {
      document.getElementById('meetingModalLabel').textContent = 'Edit Meeting';
      document.getElementById('meeting-id').value = meeting.id;
      document.getElementById('meeting-title').value = meeting.title;
      document.getElementById('meeting-date').value = meeting.meeting_date || '';
      document.getElementById('meeting-duration').value = meeting.duration_minutes || '';
      document.getElementById('meeting-participants').value = meeting.participants || '';
      document.getElementById('meeting-desc').value = meeting.description || '';
      populateProjectDropdown(meeting.project_id);
      modalInstance = new bootstrap.Modal(document.getElementById('meetingModal'));
      modalInstance.show();
    }

    async function saveMeeting() {
      const id = document.getElementById('meeting-id').value;
      const project_id = document.getElementById('meeting-project').value;
      const title = document.getElementById('meeting-title').value.trim();

      if (!title) { showToast('Meeting title is required.', 'warning'); return; }
      if (!id && !project_id) { showToast('Please select a project from the dropdown.', 'warning'); return; }

      const payload = {
        title,
        description: document.getElementById('meeting-desc').value.trim() || null,
        meeting_date: document.getElementById('meeting-date').value || null,
        duration_minutes: document.getElementById('meeting-duration').value
          ? parseFloat(document.getElementById('meeting-duration').value) : null,
        participants: document.getElementById('meeting-participants').value.trim() || null,
      };
      if (!id) payload.project_id = parseInt(project_id);

      showLoading();
      try {
        if (id) {
          await updateMeetingAPI(id, payload);
          showToast('Meeting updated!', 'success');
          if (modalInstance) modalInstance.hide();
          loadAll();
        } else {
          const newMeeting = await createMeetingAPI(payload);
          showToast('Meeting created! Opening...', 'success');
          if (modalInstance) modalInstance.hide();
          // Redirect directly to meeting detail
          setTimeout(() => {
            window.location.href = `meeting_detail.html?id=${newMeeting.id}`;
          }, 800);
        }
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        hideLoading();
      }
    }

    async function deleteMeeting(id) {
      const meeting = allMeetings.find(m => m.id === id);
      const title = meeting ? meeting.title : 'this meeting';
      if (!confirmAction(`Delete meeting "${title}"?`)) return;
      showLoading();
      try {
        await deleteMeetingAPI(id);
        showToast('Meeting deleted.', 'success');
        loadAll();
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        hideLoading();
      }
    }

    loadAll();
  </script>
</body>
</html>
