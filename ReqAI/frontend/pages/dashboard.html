<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard • ReqAI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
</head>
<body>

  <!-- Layout injected by sidebar.js -->
  <div class="main-content">
    <div class="content-area">

      <!-- Welcome banner -->
      <div class="req-card mb-4">
        <div class="card-body d-flex align-items-center gap-3">
          <div style="font-size:2.5rem;">👋</div>
          <div>
            <h5 class="mb-1" id="welcome-msg">Welcome back!</h5>
            <p class="text-muted mb-0" style="font-size:.875rem;">
              Manage your projects and meetings from your dashboard.
            </p>
          </div>
        </div>
      </div>

      <!-- Stats row -->
      <div class="row g-3 mb-4">
        <div class="col-sm-6 col-xl-3">
          <div class="stat-card">
            <div class="stat-icon indigo"><i class="fas fa-folder-open"></i></div>
            <div>
              <div class="stat-label">Total Projects</div>
              <div class="stat-value" id="stat-projects">—</div>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-xl-3">
          <div class="stat-card">
            <div class="stat-icon sky"><i class="fas fa-calendar-check"></i></div>
            <div>
              <div class="stat-label">Total Meetings</div>
              <div class="stat-value" id="stat-meetings">—</div>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-xl-3">
          <div class="stat-card">
            <div class="stat-icon green"><i class="fas fa-check-circle"></i></div>
            <div>
              <div class="stat-label">Active Projects</div>
              <div class="stat-value" id="stat-active">—</div>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-xl-3">
          <div class="stat-card">
            <div class="stat-icon amber"><i class="fas fa-file-lines"></i></div>
            <div>
              <div class="stat-label">BRDs Generated</div>
              <div class="stat-value">0</div>
              <div class="stat-change" style="color:var(--text-muted);font-size:.75rem;">Coming in Phase 3</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Recent Projects and Recent Meetings -->
      <div class="row g-3">
        <div class="col-lg-6">
          <div class="req-card">
            <div class="card-header">
              <h6 class="mb-0 fw-semibold">Recent Projects</h6>
              <a href="projects.html" style="font-size:.8rem;color:var(--primary);">View all</a>
            </div>
            <div class="card-body p-0">
              <div id="recent-projects-list"></div>
            </div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="req-card">
            <div class="card-header">
              <h6 class="mb-0 fw-semibold">Recent Meetings</h6>
              <a href="meetings.html" style="font-size:.8rem;color:var(--primary);">View all</a>
            </div>
            <div class="card-body p-0">
              <div id="recent-meetings-list"></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/sidebar.js"></script>
  <script>
    requireAuth();
    renderLayout('Dashboard', 'dashboard');

    const user = getUser();
    if (user) {
      document.getElementById('welcome-msg').textContent =
        `Welcome back, ${user.full_name || user.username}!`;
    }

    async function loadDashboard() {
      try {
        const [projectsData, meetingsData] = await Promise.all([
          getProjectsAPI(),
          getMeetingsAPI(),
        ]);

        const projects = projectsData.projects || [];
        const meetings = meetingsData.meetings || [];

        document.getElementById('stat-projects').textContent = projects.length;
        document.getElementById('stat-meetings').textContent = meetings.length;
        document.getElementById('stat-active').textContent =
          projects.filter(p => p.status === 'active').length;

        // Recent Projects list
        const projectsList = document.getElementById('recent-projects-list');
        if (projects.length === 0) {
          projectsList.innerHTML = `<div class="empty-state py-4"><i class="fas fa-folder-open"></i><p>No projects yet</p></div>`;
        } else {
          projectsList.innerHTML = projects.slice(0, 5).map(p => `
            <div class="d-flex align-items-center justify-content-between px-3 py-2 border-bottom">
              <div>
                <div style="font-weight:500;font-size:.875rem;">${p.name}</div>
                <div style="font-size:.75rem;color:var(--text-muted);">${formatDate(p.created_at)}</div>
              </div>
              ${getStatusBadge(p.status)}
            </div>`).join('');
        }

        // Recent Meetings list
        const meetingsList = document.getElementById('recent-meetings-list');
        if (meetings.length === 0) {
          meetingsList.innerHTML = `<div class="empty-state py-4"><i class="fas fa-calendar-check"></i><p>No meetings yet</p></div>`;
        } else {
          meetingsList.innerHTML = meetings.slice(0, 5).map(m => `
            <div class="d-flex align-items-center justify-content-between px-3 py-2 border-bottom">
              <div>
                <div style="font-weight:500;font-size:.875rem;">${m.title}</div>
                <div style="font-size:.75rem;color:var(--text-muted);">${formatDate(m.created_at)}</div>
              </div>
              ${getStatusBadge(m.processing_status)}
            </div>`).join('');
        }
      } catch (err) {
        showToast('Failed to load dashboard data.', 'error');
      }
    }

    loadDashboard();
  </script>
</body>
</html>
