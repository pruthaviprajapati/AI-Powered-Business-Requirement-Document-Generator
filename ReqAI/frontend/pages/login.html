<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login • ReqAI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon"><i class="fas fa-robot"></i></div>
        <h4>ReqAI</h4>
        <p>AI Powered Business Requirement Document Generator</p>
      </div>

      <form id="login-form">
        <div class="mb-3">
          <label class="form-label-custom">Username or Email</label>
          <input type="text" class="form-control-custom" id="username_or_email" required>
        </div>
        <div class="mb-3">
          <label class="form-label-custom">Password</label>
          <input type="password" class="form-control-custom" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
      </form>

      <div class="text-center">
        <small class="text-muted">Don't have an account? <a href="register.html" class="text-primary">Register</a></small>
      </div>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script>
    redirectIfAuthenticated();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username_or_email = document.getElementById('username_or_email').value.trim();
      const password = document.getElementById('password').value;

      showLoading();
      try {
        const result = await loginAPI(username_or_email, password);
        saveSession(result.access_token, result.refresh_token, result.user);
        showToast('Login successful!', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        hideLoading();
      }
    });
  </script>
</body>
</html>
